services:
  - type: web
    name: ai-code-review-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-code-review-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AI_PROVIDER
        value: huggingface
      - key: HF_TOKEN
        sync: false
      - key: HUGGINGFACE_MODEL
        value: Qwen/Qwen2.5-Coder-32B-Instruct:cheapest
      - key: HUGGINGFACE_BASE_URL
        value: https://router.huggingface.co/v1
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: PASSWORD_RESET_EXPIRE_MINUTES
        value: "15"
      - key: PASSWORD_RESET_EMAIL_PROVIDER
        value: resend
      - key: PASSWORD_RESET_FROM_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: PASSWORD_RESET_RATE_LIMIT_EMAIL
        value: "5"
      - key: PASSWORD_RESET_RATE_LIMIT_IP
        value: "10"
      - key: PASSWORD_RESET_RATE_LIMIT_WINDOW_MINUTES
        value: "15"

databases:
  - name: ai-code-review-db
    plan: free
    region: singapore
